html,body{margin:0}

.x-meta span{height:28px;padding:0 12px;border-radius:999px;background:#EEF0E3;color:#3C382E;font-size:12px;font-weight:700;display:inline-flex;align-items:center}

.x-grp h2{margin:0 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.x-num{width:26px;height:26px;border-radius:8px;background:var(--olive);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.x-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.x-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:#fff;border:1px solid #EDE9D5;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s;min-width:0}

.x-card .x-tx{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}

.x-card small{font-size:12px;color:var(--mut);line-height:1.6}
.x-card em{font-style:normal;font-size:11px;color:#8A8C78;font-weight:700}
.x-card .x-go{color:var(--olive);font-weight:800}
.x-ic{width:44px;height:44px;border-radius:10px;background:#EEF0E3;flex:none;position:relative}
.x-ic:after{content:"";position:absolute;border:2px solid var(--olive);border-radius:3px}
.x-ic.x-d:after{inset:12px 9px 14px}
.x-ic.x-m:after{inset:9px 15px;border-radius:4px}
.x-ic.x-c:after{inset:13px 8px;border-color:var(--gold);outline:1px solid var(--gold);outline-offset:-5px}
